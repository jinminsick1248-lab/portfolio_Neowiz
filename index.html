<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진민식 — 팬덤 마케팅 PM</title>
<script>
  var ua = navigator.userAgent;
  var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS/i.test(ua);
  // UA로 안 잡히면 터치 지원 + 화면 너비로 2차 판별
  if (!isMobile) {
    isMobile = (('ontouchstart' in window) || (navigator.maxTouchPoints > 0))
               && window.screen.width <= 1024;
  }
  window.location.replace(isMobile ? './mobile.html' : './pc.html');
</script>
<noscript>
  <meta http-equiv="refresh" content="0; url=./pc.html">
</noscript>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin-top:40px;color:#555;">
    페이지 이동 중...<br><br>
    <a href="./pc.html">💻 PC 버전</a> &nbsp;|&nbsp; <a href="./mobile.html">📱 모바일 버전</a>
  </p>
</body>
</html>
