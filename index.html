<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진민식 — 팬덤 마케팅 PM</title>
</head>
<body style="font-family:sans-serif;padding:40px 20px;color:#333;word-break:break-all;">
<h3 style="margin-bottom:20px;">📱 기기 정보 디버그</h3>
<script>
  var ua = navigator.userAgent || '';
  var sw = window.screen.width;
  var sh = window.screen.height;
  var shorter = Math.min(sw, sh);
  var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  var mobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS|Mobi/i.test(ua);
  var isMobile = mobileUA || (hasTouch && shorter <= 768);

  document.write('<p><b>UA:</b><br>' + ua + '</p>');
  document.write('<p><b>screen:</b> ' + sw + ' × ' + sh + '</p>');
  document.write('<p><b>shorter side:</b> ' + shorter + '</p>');
  document.write('<p><b>hasTouch:</b> ' + hasTouch + '</p>');
  document.write('<p><b>mobileUA:</b> ' + mobileUA + '</p>');
  document.write('<p><b>isMobile 판정:</b> <span style="font-size:18px;font-weight:bold;color:' + (isMobile?'#00A86B':'#E00') + '">' + (isMobile ? '✅ MOBILE' : '❌ PC') + '</span></p>');
  document.write('<hr style="margin:20px 0;">');
  document.write('<p><a href="./pc.html">💻 PC 버전으로 이동</a></p>');
  document.write('<p><a href="./mobile.html">📱 모바일 버전으로 이동</a></p>');
</script>
</body>
</html>
